{% extends 'base.html' %}{% block content %}<div class="card formcard"><form method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><input type="hidden" name="client_id" value="{{cid}}"><div class="twocol"><label>Amount (₹)<input name="amount" type="number" step="0.01" required></label><label>Date<input name="paid_at" required></label><label>Method<select name="method"><option>UPI</option><option>Bank transfer</option><option>Cash</option><option>Card</option><option>Other</option></select></label><label>Status<select name="status"><option>Paid</option><option>Pending</option><option>Partially paid</option></select></label></div><label>Notes<textarea name="notes"></textarea></label><button class="primary">Save payment</button></form></div>{% endblock %}
