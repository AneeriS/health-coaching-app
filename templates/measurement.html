{% extends 'base.html' %}{% block content %}<div class="card formcard"><form method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><input type="hidden" name="client_id" value="{{cid}}"><div class="twocol"><label>Date<input name="measured_at" value="{{ '%s'|format('') }}" placeholder="YYYY-MM-DD"></label><label>Weight (kg)<input name="weight" type="number" step="0.1"></label><label>Height (cm)<input name="height" type="number" step="0.1"></label><label>Waist (cm)<input name="waist" type="number" step="0.1"></label><label>Hip (cm)<input name="hip" type="number" step="0.1"></label><label>Body fat %<input name="body_fat" type="number" step="0.1"></label><label>Other measurement name<input name="custom_name" placeholder="e.g. arm circumference"></label><label>Other measurement value<input name="custom_value"></label></div><label>Notes<textarea name="notes"></textarea></label><button class="primary">Save measurement</button></form></div>{% endblock %}
