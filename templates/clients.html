{% extends 'base.html' %}{% block action %}<a class="btn primary" href="/client/new">+ Add Client</a>{% endblock %}{% block content %}<div class="card"><form class="search"><input name="q" value="{{ q }}" placeholder="Search name or client code"><button class="btn">Search</button></form></div><div class="card">{% for c in clients %}<a class="listrow" href="/client/{{ c.id }}"><span><b>{{ c.name }}</b><small>{{ c.client_code }} · {{ c.city or '' }} · {{ c.phone or '' }}</small></span><em>{{ c.status }}</em></a>{% else %}<p class="muted">No clients found.</p>{% endfor %}</div>{% endblock %}
